<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadiyam Balaji — AI/ML Engineer</title>
<meta name="description" content="Kadiyam Balaji — AI/ML Engineer building Generative AI systems with RAG, LangChain and ChromaDB.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F3F6;
    --paper-alt:#FFFFFF;
    --ink:#12172B;
    --ink-soft:#4B5468;
    --ink-faint:#8891A0;
    --line:#DCE2E9;
    --signal:#0E8F72;
    --signal-dark:#0B715A;
    --signal-soft:#E4F3EE;
    --warm:#D9932E;
    --radius:10px;
    --disp:'Space Grotesk', sans-serif;
    --body:'IBM Plex Sans', sans-serif;
    --mono:'IBM Plex Mono', monospace;
    --maxw:1120px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}
  img{max-width:100%; display:block;}

  ::selection{background:var(--signal); color:#fff;}

  :focus-visible{
    outline:2px solid var(--signal);
    outline-offset:3px;
    border-radius:3px;
  }

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 32px;
  }

  /* ---------- NAV ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background:rgba(241,243,246,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:68px;
  }
  .mark{
    font-family:var(--mono); font-weight:600; font-size:15px;
    letter-spacing:0.02em;
    display:flex; align-items:center; gap:8px;
    text-decoration:none;
  }
  .mark .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 0 3px var(--signal-soft);
  }
  nav ul{
    list-style:none;
    display:flex; gap:28px;
    align-items:center;
  }
  nav ul a{
    font-family:var(--mono);
    font-size:13px;
    text-decoration:none;
    color:var(--ink-soft);
    letter-spacing:0.03em;
    transition:color .15s ease;
  }
  nav ul a:hover{color:var(--ink);}
  .nav-links{display:flex;}
  .btn-resume{
    font-family:var(--mono);
    font-size:13px;
    padding:8px 14px;
    border:1px solid var(--ink);
    border-radius:6px;
    text-decoration:none;
    color:var(--ink);
    transition:all .15s ease;
    white-space:nowrap;
  }
  .btn-resume:hover{background:var(--ink); color:var(--paper);}
  .nav-toggle{display:none;}

  @media (max-width:760px){
    .nav-links{
      position:fixed; top:68px; left:0; right:0;
      background:var(--paper-alt);
      border-bottom:1px solid var(--line);
      flex-direction:column;
      align-items:flex-start;
      gap:0;
      max-height:0;
      overflow:hidden;
      transition:max-height .25s ease;
    }
    .nav-links.open{max-height:320px;}
    .nav-links li{width:100%;}
    .nav-links a{
      display:block; padding:14px 32px;
      border-bottom:1px solid var(--line);
      width:100%;
    }
    .nav-toggle{
      display:block;
      background:none; border:none; cursor:pointer;
      width:32px; height:24px; position:relative;
    }
    .nav-toggle span, .nav-toggle span::before, .nav-toggle span::after{
      content:''; position:absolute; left:0; right:0; height:2px; background:var(--ink);
    }
    .nav-toggle span{top:11px;}
    .nav-toggle span::before{top:-7px;}
    .nav-toggle span::after{top:7px;}
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:96px 0 72px;
    overflow:hidden;
  }
  .hero-field{
    position:absolute; inset:0;
    pointer-events:none;
  }
  .hero-field svg{width:100%; height:100%;}
  .hero-inner{position:relative; z-index:2;}
  .eyebrow{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--signal-dark);
    background:var(--signal-soft);
    display:inline-flex;
    padding:6px 12px;
    border-radius:20px;
    margin-bottom:26px;
  }
